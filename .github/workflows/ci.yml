name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy app
      - name: Tests (offline; sockets blocked)
        run: pytest -q

  frontend:
    name: Frontend (eslint, tsc, vitest, next build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Component tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    name: Docker (production image build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all-in-one production image
        run: docker build -t ciphershield:ci .
      - name: Smoke test (single published port, same-origin proxy)
        run: |
          set -euo pipefail
          docker run -d --name ci-smoke -p 18080:18080 -e PORT=18080 ciphershield:ci
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:18080/health | grep -q '"status":"ok"'; then ok=1; break; fi
            sleep 2
          done
          test "$ok" -eq 1
          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:18080/)
          test "$code" = "200"
          docker inspect --format '{{.State.Health.Status}}' ci-smoke | grep -q healthy
          docker logs ci-smoke
      - name: Teardown
        if: always()
        run: docker rm -f ci-smoke || true

  evaluation:
    name: Security evaluation (measured metrics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install backend
        working-directory: services/api
        run: pip install -e ".[dev]"
      - name: Run evaluation
        run: python scripts/run_security_eval.py
      - name: Upload measured report
        uses: actions/upload-artifact@v4
        with:
          name: security-evaluation
          path: |
            eval/results/summary.json
            eval/results/report.md
